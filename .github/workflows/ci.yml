name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run verify

      - name: Upload packaged XPI
        uses: actions/upload-artifact@v4
        with:
          name: zotero-agent-client-package
          path: |
            .scaffold/build/*.xpi
            .scaffold/build/update*.json
          if-no-files-found: error
