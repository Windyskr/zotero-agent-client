<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label
    ><html:h2 class="acpchat-pref-title" data-l10n-id="pref-title"></html:h2
  ></label>
  <html:p class="acpchat-pref-subtitle" data-l10n-id="pref-subtitle"></html:p>

  <html:div class="acpchat-pref-section">
    <html:h3 data-l10n-id="pref-section-basics"></html:h3>
    <html:div class="acpchat-pref-grid">
      <html:label
        for="zotero-prefpane-__addonRef__-defaultAgent"
        data-l10n-id="pref-default-agent"
      />
      <html:div class="acpchat-pref-field">
        <html:input id="zotero-prefpane-__addonRef__-defaultAgent" />
        <html:p
          class="acpchat-pref-helptext"
          data-l10n-id="pref-default-agent-help"
        ></html:p>
      </html:div>

      <html:label
        for="zotero-prefpane-__addonRef__-sendKeyMode"
        data-l10n-id="pref-send-key-mode"
      />
      <html:div class="acpchat-pref-field">
        <html:select id="zotero-prefpane-__addonRef__-sendKeyMode">
          <html:option
            value="ctrlEnter"
            data-l10n-id="pref-send-key-mode-ctrl-enter"
          ></html:option>
          <html:option
            value="enter"
            data-l10n-id="pref-send-key-mode-enter"
          ></html:option>
        </html:select>
        <html:p
          class="acpchat-pref-helptext"
          data-l10n-id="pref-send-key-mode-help"
        ></html:p>
      </html:div>

      <html:label
        for="zotero-prefpane-__addonRef__-chatFontSizePx"
        data-l10n-id="pref-chat-font-size"
      />
      <html:div class="acpchat-pref-field">
        <html:input
          id="zotero-prefpane-__addonRef__-chatFontSizePx"
          type="number"
          min="10"
          max="18"
          step="0.5"
        />
        <html:p
          class="acpchat-pref-helptext"
          data-l10n-id="pref-chat-font-size-help"
        ></html:p>
      </html:div>

      <html:label
        for="zotero-prefpane-__addonRef__-toolDetailsDefaultOpen"
        data-l10n-id="pref-tool-details-default-open"
      />
      <html:div class="acpchat-pref-field">
        <html:select id="zotero-prefpane-__addonRef__-toolDetailsDefaultOpen">
          <html:option
            value="true"
            data-l10n-id="pref-tool-details-default-open-true"
          ></html:option>
          <html:option
            value="false"
            data-l10n-id="pref-tool-details-default-open-false"
          ></html:option>
        </html:select>
        <html:p
          class="acpchat-pref-helptext"
          data-l10n-id="pref-tool-details-default-open-help"
        ></html:p>
      </html:div>

      <html:label
        for="zotero-prefpane-__addonRef__-sessionStorePath"
        data-l10n-id="pref-session-store"
      />
      <html:div class="acpchat-pref-field">
        <html:input id="zotero-prefpane-__addonRef__-sessionStorePath" />
        <html:p
          class="acpchat-pref-helptext"
          data-l10n-id="pref-session-store-help"
        ></html:p>
      </html:div>
    </html:div>
  </html:div>

  <html:div class="acpchat-pref-section">
    <html:h3 data-l10n-id="pref-section-agents"></html:h3>
    <html:div class="acpchat-pref-grid">
      <html:label
        for="zotero-prefpane-__addonRef__-agentProfiles"
        data-l10n-id="pref-agent-profiles"
      />
      <html:div class="acpchat-pref-field">
        <html:textarea
          id="zotero-prefpane-__addonRef__-agentProfiles"
          rows="9"
          spellcheck="false"
        />
        <html:p
          class="acpchat-pref-helptext"
          data-l10n-id="pref-agent-profiles-help"
        ></html:p>
        <html:div class="acpchat-pref-command">
          <html:span data-l10n-id="pref-codex-install-label"></html:span>
          <html:code
            >npm install -g @agentclientprotocol/claude-agent-acp</html:code
          >
        </html:div>
      </html:div>
    </html:div>
  </html:div>

  <html:div class="acpchat-pref-actions">
    <html:button
      id="zotero-prefpane-__addonRef__-saveSettings"
      type="button"
      data-l10n-id="pref-save-button"
    ></html:button>
    <html:span
      id="zotero-prefpane-__addonRef__-saveStatus"
      class="acpchat-pref-save-status"
    ></html:span>
  </html:div>

  <html:div class="acpchat-pref-section">
    <html:h3 data-l10n-id="pref-section-maintenance"></html:h3>
    <html:div class="acpchat-pref-grid">
      <html:label data-l10n-id="pref-clear-cache" />
      <html:div class="acpchat-pref-cache">
        <html:button
          id="zotero-prefpane-__addonRef__-clearCache"
          type="button"
          data-l10n-id="pref-clear-cache-button"
        ></html:button>
        <html:span
          id="zotero-prefpane-__addonRef__-clearCacheStatus"
          class="acpchat-pref-cache-status"
        ></html:span>
      </html:div>
    </html:div>
  </html:div>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
