<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <html:div class="acpchat-pref-grid">
    <html:label for="zotero-prefpane-__addonRef__-defaultAgent" data-l10n-id="pref-default-agent" />
    <html:input id="zotero-prefpane-__addonRef__-defaultAgent" preference="defaultAgent" />
    <html:label for="zotero-prefpane-__addonRef__-defaultPresetId" data-l10n-id="pref-default-preset" />
    <html:input id="zotero-prefpane-__addonRef__-defaultPresetId" preference="defaultPresetId" />
    <html:label for="zotero-prefpane-__addonRef__-sessionStorePath" data-l10n-id="pref-session-store" />
    <html:input id="zotero-prefpane-__addonRef__-sessionStorePath" preference="sessionStorePath" />
    <html:label for="zotero-prefpane-__addonRef__-defaultTemplate" data-l10n-id="pref-template" />
    <html:textarea id="zotero-prefpane-__addonRef__-defaultTemplate" preference="defaultTemplate" rows="3" />
    <html:label for="zotero-prefpane-__addonRef__-agentProfiles" data-l10n-id="pref-agent-profiles" />
    <html:textarea id="zotero-prefpane-__addonRef__-agentProfiles" preference="agentProfiles" rows="8" spellcheck="false" />
    <html:label for="zotero-prefpane-__addonRef__-promptPresets" data-l10n-id="pref-prompt-presets" />
    <html:textarea id="zotero-prefpane-__addonRef__-promptPresets" preference="promptPresets" rows="8" spellcheck="false" />
  </html:div>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
